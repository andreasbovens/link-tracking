<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 2</title>
  </head>
  <body>
    <h1>This is Page 2</h1>

    <p>All links below will inherit the reference:</p>

    <ul>
      <li><a href="page3.html">Go to Page 3</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>

    <script>
      // 1. Get the 'ref' value from the current URL
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      const refValue = urlParams.get("ref");

      // 2. Only run this if we actually found a 'ref'
      if (refValue) {
        // 3. Select ALL <a> tags on the page
        const allLinks = document.querySelectorAll("a");

        // 4. Loop through each link
        allLinks.forEach((link) => {
          // Get the current href of the link
          let currentHref = link.getAttribute("href");

          // Skip if the link has no href (e.g. anchor tags)
          if (!currentHref) return;

          // Check if the link already has a '?'
          // If it does, we use '&' to add the new param. If not, we use '?'.
          const separator = currentHref.includes("?") ? "&" : "?";

          // Update the link
          link.setAttribute(
            "href",
            currentHref + separator + "ref=" + refValue,
          );
        });
      }
    </script>
  </body>
</html>
